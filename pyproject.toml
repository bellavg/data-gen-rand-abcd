[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-gen-rand-abcd"
version = "0.1.0"
description = "AIG to PyG preprocessing and GNN experimentation utilities."
readme = "AIG_DATASET_README.md"
requires-python = ">=3.10"
dependencies = [
    "aigverse[adapters]",
    "numpy>=1.23",
    "networkx>=3.0",
    "pandas>=1.5",
    "scipy>=1.10",
    "torch>=2.1",
    "torch-geometric>=2.5",
    "optuna>=3.0",
    "pytorch-lightning>=2.0",
    "lightning>=2.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
pyg = [
    "torch-scatter>=2.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:torch_geometric.*",
    "ignore::DeprecationWarning:torch.jit.*",
    "ignore::DeprecationWarning:pytorch_lightning.*",
    "ignore::DeprecationWarning:lightning.*",
]
log_level = "WARNING"

[tool.setuptools.packages.find]
where = ["src"]
include = ["data*", "models*"]
namespaces = true
