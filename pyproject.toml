[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-gen-rand-abcd"
version = "0.1.0"
description = "AIG to PyG preprocessing and GNN experimentation utilities."
readme = "AIG_DATASET_README.md"
requires-python = ">=3.10"
dependencies = [
    "aigverse[adapters]>=0.0.27",
    "numpy>=2.4,<3",
    "networkx>=3.6",
    "pandas>=3.0",
    "scipy>=1.17",
    "matplotlib>=3.9",
    "torch>=2.11,<2.12",
    "torch-geometric>=2.7,<2.8",
    "optuna>=4.8,<5",
    "optuna-integration>=4.8,<5",
    "sqlalchemy>=2.0",
    "pytorch-lightning>=2.6,<3",
    "wandb>=0.18",
    "tqdm>=4.66",
    "psutil>=5.9",
    "xxhash>=3.0",
    "pymetis>=2025.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
pyg = [
    # Install with the PyG wheel index — see src/shell/rebuild_venv.sh
    # pip install ".[pyg]" --find-links https://data.pyg.org/whl/torch-2.11.0+cu130.html
    "torch-scatter>=2.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.ruff.lint.per-file-ignores]
# Vendored third-party source -- see src/baselines/deepgate4/PROVENANCE.md.
# Both findings are in upstream's own code, not imports, so unlike the unused
# imports removed from the vendored files they cannot be silently "fixed":
#   E711  `G.batch == None` in `generate_hs_init`. For a tensor, `== None` is
#         elementwise and `is None` is a plain bool, so this is a behavioural
#         difference, not a style one -- even though the function is dead code
#         in this project.
#   E713  `not (k in state_dict)` in `load()`. Cosmetic, but left alone so the
#         file still diffs cleanly against upstream.
# Scoped to this one file: aig_features.py and regressor.py in the same
# directory are ours and ARE linted. The HOGA and OpenABC-D vendored files need
# no entry; they are already clean under Ruff defaults.
"src/baselines/deepgate4/dg2.py" = ["E711", "E713"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:torch_geometric.*",
    "ignore::DeprecationWarning:torch.jit.*",
    "ignore::DeprecationWarning:pytorch_lightning.*",
    "ignore::DeprecationWarning:lightning.*",
]
log_level = "WARNING"

[tool.setuptools.packages.find]
where = ["src"]
include = ["data*", "models*"]
namespaces = true
